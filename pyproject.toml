[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-siger"
version = "0.2.0"
description = "Sistema Inteligente de Gerenciamento de Riscos — telemetria de decolagem e pouso de módulos espaciais"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Gabriel Carmona Bittencourt", email = "gabrielcarmonabittencourtpy@gmail.com" },
    { name = "Iúri Leão de Almeida", email = "iurileao@gmail.com" },
    { name = "Márcio Francisco dos Santos Júnior", email = "marciofsantos65@gmail.com" },
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
viz = [
    "seaborn>=0.13",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "anywidget>=0.9.13",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
include = ["aurora_siger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
