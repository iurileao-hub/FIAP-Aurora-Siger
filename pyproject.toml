[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-siger"
version = "0.2.0"
description = "Sistema Inteligente de Gerenciamento de Riscos — telemetria de decolagem e pouso de módulos espaciais"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Gabriel Carmona Bittencourt", email = "gabrielcarmonabittencourtpy@gmail.com" },
    { name = "Iúri Leão de Almeida", email = "iurileao@gmail.com" },
    { name = "Márcio Francisco dos Santos Júnior", email = "marciofsantos65@gmail.com" },
]
keywords = [
    "anomaly-detection",
    "boolean-logic",
    "data-structures",
    "education",
    "fiap",
    "isolation-forest",
    "linear-data-structures",
    "telemetry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
viz = [
    "seaborn>=0.13",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "anywidget>=0.9.13",
]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[project.scripts]
mgpeb = "aurora_siger.landing.cli:main"

[project.urls]
Homepage = "https://github.com/iurileao-hub/FIAP-Aurora-Siger"
Repository = "https://github.com/iurileao-hub/FIAP-Aurora-Siger"
Issues = "https://github.com/iurileao-hub/FIAP-Aurora-Siger/issues"

[tool.setuptools.packages.find]
include = ["aurora_siger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
